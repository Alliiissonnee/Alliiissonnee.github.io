  <main class="page-contact">

    <section class="carte carte--rose formulaire-contact">
      <h1 data-i18n="accueil.contact">Contactez-moi</h1>
      <form action="https://formspree.io/f/maenbekq" method="POST">
        <p>
          <label for="nom" data-i18n="form.nom">Nom</label>
          <input type="text" id="nom" name="nom" autocomplete="family-name" required>
        </p>
        <p>
          <label for="prenom" data-i18n="form.prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" autocomplete="given-name" required>
        </p>
        <p>
          <label for="email" data-i18n="form.email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </p>
        <p>
          <label for="message" data-i18n="form.message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </p>
        <!-- Piège anti-spam : invisible pour les visiteurs, Formspree rejette les envois qui le remplissent -->
        <input class="piege" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="bouton" type="submit" data-i18n="form.envoyer">Envoyer</button>
      </form>
    </section>

    <figure class="carte illustration">
      <img src="assets/images/illustration-contact.png" alt="">
    </figure>
